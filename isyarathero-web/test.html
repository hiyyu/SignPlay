<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SignBridge — Hardware Camera Test</title>
  <style>
    body {
      background: #090B10;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 40px 20px;
    }
    .card {
      max-width: 600px;
      margin: 0 auto;
      background: #121620;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    button {
      background: #38BDF8;
      color: #000;
      font-weight: bold;
      border: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #0284C7; }
    #status {
      margin-top: 15px;
      font-family: monospace;
      font-size: 13px;
      padding: 12px;
      border-radius: 8px;
      background: #050608;
      border: 1px solid rgba(255,255,255,0.06);
    }
    video {
      width: 100%;
      max-width: 500px;
      margin-top: 20px;
      border-radius: 12px;
      border: 1px solid #38BDF8;
      transform: scaleX(-1);
    }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="margin-top:0">Direct Hardware Camera Diagnostic</h2>
    <p style="color:#94A3B8; font-size:13px;">This isolated test directly requests your webcam stream to verify permissions and device status.</p>
    
    <button onclick="probeCamera()">▶ Test Camera Access</button>
    <div id="status">Click button above to test...</div>

    <video id="view" autoplay playsinline muted></video>
    
    <div style="margin-top:20px;">
      <a href="/" style="color:#38BDF8; text-decoration:none; font-size:13px;">← Return to Main Application</a>
    </div>
  </div>

  <script>
    async function probeCamera() {
      const st = document.getElementById("status");
      st.innerHTML = "Requesting video stream from browser...";
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        document.getElementById("view").srcObject = stream;
        st.innerHTML = "<span style='color:#10B981; font-weight:bold;'>✓ Camera Connected Successfully!</span>";
      } catch (err) {
        st.innerHTML = "<span style='color:#F43F5E; font-weight:bold;'>Error: " + err.name + "</span><br><span style='color:#94A3B8; font-size:11px;'>" + err.message + "</span>";
      }
    }
  </script>
</body>
</html>

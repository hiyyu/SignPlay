<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign model test</title>
<style>
body{font-family:system-ui,sans-serif;max-width:560px;margin:16px auto;padding:0 16px}
video{width:100%;transform:scaleX(-1);border-radius:12px;background:#000}
button{font-size:1.1rem;padding:10px 16px;margin:8px 8px 8px 0}
#out{font-size:1.2rem;white-space:pre-line}
</style>
</head>
<body>
<h1>Sign model test</h1>
<video id="v" autoplay muted playsinline></video>
<div>
  <button id="start" disabled>1. Start camera</button>
  <button id="rec" disabled>2. Record 2.5 s</button>
</div>
<p>I am signing: <select id="want"></select></p>
<p id="status">Loading models...</p>
<p id="out"></p>
<pre id="log"></pre>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>
<script type="module">
import { FilesetResolver, HandLandmarker, PoseLandmarker }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const N_FRAMES = 48;
const POSE_KEEP = [0, 11, 12, 13, 14, 15, 16];
const $ = id => document.getElementById(id);
const video = $("v");
let hand, pose, session, meta;

async function load() {
  const fs = await FilesetResolver.forVisionTasks(WASM);
  hand = await HandLandmarker.createFromOptions(fs, {
    baseOptions: { modelAssetPath: "models/hand_landmarker.task" },
    runningMode: "VIDEO", numHands: 2 });
  pose = await PoseLandmarker.createFromOptions(fs, {
    baseOptions: { modelAssetPath: "models/pose_landmarker_lite.task" },
    runningMode: "VIDEO" });
  session = await ort.InferenceSession.create("models/sign_gru.onnx");
  meta = await (await fetch("models/labels.json")).json();
  const words = [...new Set(Object.values(meta.word_of))];
  $("want").innerHTML = words.map(w => "<option>" + w + "</option>").join("");
  $("status").textContent = "Models loaded. Click Start camera.";
  $("start").disabled = false;
}

function flat(lms, n) {
  const a = new Float32Array(n * 3);
  if (lms) for (let i = 0; i < n; i++) {
    a[i * 3] = lms[i].x; a[i * 3 + 1] = lms[i].y; a[i * 3 + 2] = lms[i].z;
  }
  return a;
}

function frameVector(src, ts) {
  const h = hand.detectForVideo(src, ts);
  const p = pose.detectForVideo(src, ts);
  let left = null, right = null;
  h.landmarks.forEach((lms, i) => {
    if (h.handedness[i][0].categoryName === "Left") left = lms; else right = lms;
  });
  const body = p.landmarks.length ? p.landmarks[0] : null;
  const out = new Float32Array(225);
  out.set(flat(left, 21), 0);
  out.set(flat(right, 21), 63);
  out.set(flat(body, 33), 126);
  return out;
}

function median(arr) {
  const s = [...arr].sort((a, b) => a - b), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

// Same steps as preprocess.py
function preprocess(frames) {
  const T = frames.length;
  const pts = frames.map(f => {
    const r = [];
    for (let k = 0; k < 75; k++) r.push([f[k * 3], f[k * 3 + 1], f[k * 3 + 2]]);
    return r;
  });
  const present = pts.map(fr => fr.map(q => Math.abs(q[0]) + Math.abs(q[1]) + Math.abs(q[2]) > 0));
  const LS = 42 + 11, RS = 42 + 12;
  const ok = [];
  for (let t = 0; t < T; t++) if (present[t][LS] && present[t][RS]) ok.push(t);
  if (!ok.length) return null;
  const ctr = [0, 1, 2].map(d => median(ok.map(t => (pts[t][LS][d] + pts[t][RS][d]) / 2)));
  const scale = median(ok.map(t => Math.hypot(
    pts[t][LS][0] - pts[t][RS][0], pts[t][LS][1] - pts[t][RS][1], pts[t][LS][2] - pts[t][RS][2])));
  if (scale < 1e-6) return null;

  const keep = [];
  for (let i = 0; i < 42; i++) keep.push(i);
  POSE_KEEP.forEach(i => keep.push(42 + i));

  const all = [], pk = [];
  for (let t = 0; t < T; t++) {
    const norm = pts[t].map((q, k) => present[t][k]
      ? [(q[0] - ctr[0]) / scale, (q[1] - ctr[1]) / scale, (q[2] - ctr[2]) / scale]
      : [0, 0, 0]);
    const kept = keep.map(k => norm[k]);
    const kp = keep.map(k => present[t][k]);
    const locals = [];
    for (const s of [0, 21]) {
      const h = kept.slice(s, s + 21);
      let size = Math.hypot(h[9][0] - h[0][0], h[9][1] - h[0][1], h[9][2] - h[0][2]);
      if (!(size > 1e-6)) size = 1;
      h.forEach((q, k) => locals.push(kp[s + k]
        ? [(q[0] - h[0][0]) / size, (q[1] - h[0][1]) / size, (q[2] - h[0][2]) / size]
        : [0, 0, 0]));
    }
    all.push(kept.concat(locals));
    pk.push(kp);
  }

  let first = -1, last = -1;
  for (let t = 0; t < T; t++) {
    if (pk[t].slice(0, 42).some(Boolean)) { if (first < 0) first = t; last = t; }
  }
  if (first < 0) return null;
  const seq = all.slice(first, last + 1).map(fr => fr.flat());
  const L = seq.length, D = seq[0].length;   // D should be 273
  const out = new Float32Array(N_FRAMES * D);
  for (let i = 0; i < N_FRAMES; i++) {
    const pos = L === 1 ? 0 : (i / (N_FRAMES - 1)) * (L - 1);
    const i0 = Math.floor(pos), i1 = Math.min(i0 + 1, L - 1), w = pos - i0;
    for (let j = 0; j < D; j++) out[i * D + j] = seq[i0][j] * (1 - w) + seq[i1][j] * w;
  }
  return out;
}

async function predict(data) {
  const x = new ort.Tensor("float32", data, [1, N_FRAMES, 273]);
  const res = await session.run({ x });
  const logits = Array.from(res.logits.data);
  const mx = Math.max(...logits);
  const ex = logits.map(v => Math.exp(v - mx));
  const sum = ex.reduce((a, b) => a + b, 0);
  const probs = ex.map(v => v / sum);
  return probs.map((p, i) => [p, i]).sort((a, b) => b[0] - a[0]).slice(0, 3);
}

$("start").onclick = async () => {
  const stream = await navigator.mediaDevices.getUserMedia(
    { video: { width: 640, height: 480, facingMode: "user" } });
  video.srcObject = stream;
  await video.play();
  $("rec").disabled = false;
  $("start").disabled = true;
  $("status").textContent = "Camera on. Click Record, then sign.";
};

$("rec").onclick = async () => {
  $("rec").disabled = true;
  $("out").textContent = "";
  for (let n = 2; n > 0; n--) {
    $("status").textContent = "Get ready... " + n;
    await new Promise(r => setTimeout(r, 1000));
  }
  $("status").textContent = "Recording... sign now!";

  // Step 1: grab pictures as fast as possible (no tracking yet)
  const shots = [];
  const t0 = performance.now();
  let lastTime = -1;
  await new Promise(done => {
    async function tick() {
      const now = performance.now();
      if (now - t0 > 2500) return done();
      if (video.currentTime !== lastTime) {
        lastTime = video.currentTime;
        shots.push({ ts: now, img: await createImageBitmap(video) });
      }
      requestAnimationFrame(tick);
    }
    tick();
  });

  // Step 2: run the hand and body tracking on every second saved picture
  const frames = [];
  for (let i = 0; i < shots.length; i += 3) {
    $("status").textContent = "Processing " + (i + 1) + " of " + shots.length + " pictures...";
    await new Promise(r => setTimeout(r, 0));
    frames.push(frameVector(shots[i].img, shots[i].ts));
  }
  shots.forEach(s => s.img.close());

  const data = preprocess(frames);
  if (!data) {
    $("status").textContent = "No hands or shoulders found. Move back so your shoulders and hands are visible.";
  } else {
    const top = await predict(data);
    $("status").textContent = "Done (" + shots.length + " pictures captured, " + frames.length + " used).";
    $("out").textContent = top.map(([p, i]) =>
            meta.word_of[meta.labels[i]] + " (" + meta.labels[i] + ")  " + Math.round(p * 100) + "%").join("\n");
    const want = $("want").value;
    const guesses = top.map(([p, i]) => meta.word_of[meta.labels[i]] + " " + Math.round(p * 100) + "%");
    const hit = meta.word_of[meta.labels[top[0][1]]] === want ? "OK  " : (top.some(([p, i]) => meta.word_of[meta.labels[i]] === want) ? "TOP3" : "MISS");
    $("log").textContent += hit + "  " + want + " -> " + guesses.join(" / ") + "\n";
  }
  $("rec").disabled = false;
};

load().catch(e => { $("status").textContent = "Error: " + e; console.error(e); });
</script>
</body>
</html>

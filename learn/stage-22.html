<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SignPlay! – Stage 22</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8e8;--ink:#1f1b4d;--muted:#6c6794;--card:#fff;--lock:#e4e0f5;--sun:#ffc83d;--coral:#ff6b57;--teal:#1fb5a8;--green:#2fcf7f;--line:#1f1b4d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15123a;--ink:#fff6dc;--muted:#a49ed6;--card:#201b57;--lock:#2f2a74;--line:#0b0922}}
:root[data-theme="dark"]{--bg:#15123a;--ink:#fff6dc;--muted:#a49ed6;--card:#201b57;--lock:#2f2a74;--line:#0b0922}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.05rem/1.55 Nunito,system-ui,sans-serif}
h1,h2,h3{font-family:"Baloo 2",system-ui,sans-serif;line-height:1.1;margin:0}
button,a.btn{font:800 1.1rem "Baloo 2",sans-serif;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #3aa0ff;outline-offset:3px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:#2a2272;color:#fff6dc;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:4px solid #0f0c2e}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#2a2272;z-index:20}
.dots{flex:1;display:flex;gap:5px}.dots i{flex:1;height:10px;border-radius:9px;background:#0f0c2e;border:2px solid #fff6dc;transition:background .3s}
.dots i.on{background:var(--sun)}.dots i.now{background:#fff6dc}
.chip{font:800 .95rem "Baloo 2",sans-serif;background:#fff6dc;color:#1f1b4d;border-radius:99px;padding:0 12px}
main{max-width:560px;margin:0 auto;padding:22px 16px 60px}
.tag{font:800 .9rem "Baloo 2",sans-serif;background:var(--sun);color:#1f1b4d;border-radius:99px;padding:0 12px;display:inline-block}
h1{font-size:clamp(2rem,7vw,2.6rem);margin:10px 0 8px}h2{font-size:1.7rem;margin:6px 0 10px}
.card{background:var(--card);border:4px solid var(--line);border-radius:24px;box-shadow:0 6px 0 var(--line);padding:20px;margin:16px 0}
.muted{color:var(--muted)}
.btn{display:block;width:100%;background:var(--sun);color:#1f1b4d;border:3px solid #0f0c2e;border-radius:999px;padding:10px 20px;box-shadow:0 5px 0 #0f0c2e;text-align:center;text-decoration:none;margin-top:16px}
.btn.alt{background:var(--card);color:var(--ink);border-color:var(--line);box-shadow:0 5px 0 var(--line)}
.btn:disabled{background:var(--lock);color:var(--muted);box-shadow:none;cursor:not-allowed}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #0f0c2e}
.row{display:flex;gap:10px}.row .btn{margin-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}.chips span{font:700 .95rem Nunito,sans-serif;background:var(--lock);border-radius:99px;padding:2px 12px}
.demo{aspect-ratio:16/10;background:linear-gradient(135deg,#6b4ce6,#2a2272);border-radius:18px;border:3px solid var(--line);display:grid;place-items:center;color:#fff6dc;text-align:center;padding:12px;overflow:hidden}
.demo video{width:100%;height:100%;object-fit:cover}
.demo b{display:block;font:800 2.6rem "Baloo 2",sans-serif;line-height:1}
.demo small{opacity:.8}
.word{font:800 2.4rem "Baloo 2",sans-serif;margin:14px 0 4px}
.note{border-left:5px solid var(--coral);padding:4px 0 4px 12px;margin:12px 0 0;color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opts.one{grid-template-columns:1fr}
.opt{background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 4px 0 var(--line);font-size:1.05rem}
.opt.ok{background:var(--green);color:#1f1b4d}.opt.no{background:var(--coral);color:#1f1b4d}
.fb{min-height:1.6em;font:800 1.1rem "Baloo 2",sans-serif;margin-top:12px}
.cam{position:relative;aspect-ratio:4/3;background:#0f0c2e;border-radius:18px;border:3px solid var(--line);display:grid;place-items:center;color:#c9c4f2;text-align:center;padding:12px;overflow:hidden}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam .corner{position:absolute;width:30px;height:30px;border:5px solid var(--sun)}
.c1{top:10px;left:10px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}.c2{top:10px;right:10px;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.c3{bottom:10px;left:10px;border-right:0;border-top:0;border-radius:0 0 0 10px}.c4{bottom:10px;right:10px;border-left:0;border-top:0;border-radius:0 0 10px 0}
.stars{font-size:3rem;text-align:center;letter-spacing:6px}
.big{font:800 3.4rem "Baloo 2",sans-serif;text-align:center;color:var(--teal);line-height:1}
.sent{font:800 1.9rem "Baloo 2",sans-serif;text-align:center;margin:10px 0}
.face{font-size:3rem;line-height:1}
.chk{display:grid;gap:8px;margin-top:12px}
.chk label{display:flex;gap:10px;align-items:center;background:var(--card);border:3px solid var(--line);border-radius:14px;padding:10px;font-weight:700}
.chk input{width:22px;height:22px;accent-color:var(--teal);flex:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="dots" id="dots" aria-hidden="true"></div>
  <span class="chip" id="xp"></span>
</header>
<main id="m"></main>
<script src="progress.js"></script>

<script>
/* ===== STAGE 22 DATA: Questions & Non-Manual Markers =====
   cues:  the two question types. {w, e (emoji), face (what the face does), ex (example), v (demo video), t, m}
   sents: practice sentences. k = "yn" (Yes/No) or "wh" (Wh-).
   Practise uses a SELF-CHECK. The learner compares with the demo and ticks what they did.
   To add automatic face tracking later, replace faceCheck() (see below). */
var D={id:22,level:3,title:"Questions & Non-Manual Markers",goal:"Use your eyebrows and head to show a Yes/No question or a Wh- question.",xp:100,pass:50,
cues:{
 yn:{w:"Yes/No question",e:"😮",face:"Eyebrows up, head tilted slightly forward, eyes on the person.",ex:"“Are you hungry?”",v:"",m:"Keep your eyebrows raised until the end of the question."},
 wh:{w:"Wh- question",e:"🤨",face:"Eyebrows down (furrowed), head tilted slightly, eyes on the person.",ex:"“Where is the bathroom?”",v:"",m:"Lower your eyebrows. Don’t raise them for who, what or where."}},
sents:[
 {s:"Are you hungry?",k:"yn",v:""},{s:"Do you understand?",k:"yn"},{s:"Is this your bag?",k:"yn"},
 {s:"Where is the bathroom?",k:"wh"},{s:"What is your name?",k:"wh"},{s:"Who is your teacher?",k:"wh"}],
checks:{yn:["My eyebrows stayed up","My head tilted slightly forward","I kept it up until the end"],
        wh:["My eyebrows stayed down","My head tilted slightly","I kept it down until the end"]}};

/* OPTIONAL face tracking: return a Promise that resolves {brows:"up"|"down"} from the live <video>.
   Return null to keep the self-check. */
function faceCheck(video){return null}

var STEPS=["Intro","Learn","Recognise","Practise","Play","Results"];
var MARKS=["Eyebrows up","Eyebrows down","Eyebrows flat (neutral)","Head shake"];
var $=function(i){return document.getElementById(i)};
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
var S,stream=null;
function ans(k){return k==="yn"?0:1}
function reset(){S={st:0,i:0,rc:0,pc:0,mg:0,
  Q:shuf(D.sents).slice(0,5),P:shuf(D.sents).slice(0,4),G:shuf(D.sents).slice(0,4).map(function(s){var o=shuf(D.sents.filter(function(x){return x.k!==s.k})).slice(0,2);return{s:s,o:shuf([s].concat(o))}})}}
function stop(){if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}}
function demo(x){return '<div class="demo">'+(x.v?'<video src="'+x.v+'" autoplay loop muted playsinline></video>':'<div><b>▶</b><small>Demo video coming soon</small><small> · '+(x.w||'“'+x.s+'”')+'</small></div>')+'</div>'}
function showCam(){var c=$("cam");if(!c||!stream)return;var v=document.createElement("video");v.autoplay=true;v.muted=true;v.playsInline=true;v.srcObject=stream;c.insertBefore(v,c.firstChild);$("cmsg").textContent="";var b=document.querySelector('[data-a="cam"]');if(b){b.textContent="Camera on";b.disabled=true}}
function camOn(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$("cmsg").textContent="Camera not available here";return}
  navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}}).then(function(s){stream=s;showCam()}).catch(function(){$("cmsg").textContent="Camera blocked. You can still use the self-check."})}
function go(n,i){if(n!==3)stop();S.st=n;S.i=i||0;draw();window.scrollTo(0,0)}
function total(){return Math.round((S.rc+S.pc+S.mg)/(S.Q.length+S.P.length+S.G.length)*100)}
function fb(t,c){var f=$("fb");if(f){f.textContent=t;f.style.color=c||"var(--ink)"}}
function after(fn,ms){setTimeout(fn,ms||900)}
function draw(){
  $("xp").textContent="+"+D.xp+" XP";
  $("dots").innerHTML=STEPS.map(function(_,k){return '<i class="'+(k<S.st?"on":k===S.st?"now":"")+'"></i>'}).join("");
  var h="",st=S.st,c=D.cues;
  if(st===0){
    h='<span class="tag">Level '+D.level+' · Stage '+D.id+'</span><h1>'+D.title+'</h1><p class="muted">'+D.goal+'</p><div class="card"><h2>In this stage</h2><div class="chips"><span>'+c.yn.w+'</span><span>'+c.wh.w+'</span><span>Eyebrows</span><span>Head tilt</span></div><p class="muted" style="margin:14px 0 0">In sign language your face is part of the grammar. Same hands, different face, different question.</p><p class="muted" style="margin:10px 0 0">About 10 minutes · Reward: '+D.xp+' XP · Pass mark: '+D.pass+'%</p></div><button class="btn" data-a="next">Start stage</button>';
  }else if(st===1){
    var x=S.i?c.wh:c.yn;
    h='<span class="tag">Learn '+(S.i+1)+'/2</span>'+demo(x)+'<div class="word">'+x.e+' '+x.w+'</div><p style="margin:0">'+x.face+'</p><p class="muted" style="margin:6px 0 0">Example: '+x.ex+'</p><p class="note"><b>Common mistake:</b> '+x.m+'</p><div class="row"><button class="btn alt" data-a="prev"'+(S.i?'':' disabled')+'>Back</button><button class="btn" data-a="nxt">'+(S.i<1?"Got it":"Finish learning")+'</button></div>';
  }else if(st===2){
    var q=S.Q[S.i];
    h='<span class="tag">Recognise '+(S.i+1)+'/'+S.Q.length+'</span><h2>Which face goes with this question?</h2>'+(q.v?demo(q):'')+'<div class="sent">“'+q.s+'”</div><div class="opts">'+MARKS.map(function(o,k){return '<button class="opt" data-a="rc" data-k="'+k+'">'+o+'</button>'}).join("")+'</div><div class="fb" id="fb"></div>';
  }else if(st===3){
    var p=S.P[S.i],cu=c[p.k];
    h='<span class="tag">Practise '+(S.i+1)+'/'+S.P.length+'</span><h2>Sign: “'+p.s+'”</h2><p class="muted" style="margin:0 0 10px">Face: '+cu.face+'</p><div class="cam" id="cam"><i class="corner c1"></i><i class="corner c2"></i><i class="corner c3"></i><i class="corner c4"></i><span id="cmsg">Camera is off</span></div><button class="btn alt" data-a="cam">Turn on camera</button><div class="chk" id="chk">'+D.checks[p.k].map(function(t,k){return '<label><input type="checkbox" data-k="'+k+'"> '+t+'</label>'}).join("")+'</div><div class="fb" id="fb"></div><button class="btn" data-a="done">Done</button><button class="btn alt" data-a="pskip">Skip this one</button><p class="muted" style="font-size:.85rem;margin:12px 0 0">Self-check: watch yourself in the mirror, then tick what you did. Tick at least 2 to count it.</p>';
  }else if(st===4){
    var g=S.G[S.i];
    h='<span class="tag">Play '+(S.i+1)+'/'+S.G.length+'</span><h2>Which question matches this face?</h2><div class="card" style="text-align:center"><div class="face">'+c[g.s.k].e+'</div><p style="margin:8px 0 0">'+c[g.s.k].face+'</p></div><div class="opts one">'+g.o.map(function(o,k){return '<button class="opt" data-a="pg" data-k="'+k+'">“'+o.s+'”</button>'}).join("")+'</div><div class="fb" id="fb"></div>';
  }else{
    var t=total(),ok=t>=D.pass,stars=t>=90?3:t>=80?2:t>=D.pass?1:0;if(window.SPProgress){setTimeout(function(){SPProgress.addBack(ok)},0);if(ok)SPProgress.complete(D.id,t,stars)}
    h='<span class="tag">'+(ok?"Stage complete!":"Almost there")+'</span><h1>'+D.title+'</h1><div class="card"><div class="stars" aria-label="'+stars+' of 3 stars">'+"★".repeat(stars)+'<span style="opacity:.25">'+"★".repeat(3-stars)+'</span></div><div class="big">'+t+'%</div><p class="muted" style="text-align:center;margin:6px 0 0">Recognise '+S.rc+'/'+S.Q.length+' · Practise '+S.pc+'/'+S.P.length+' (self-check) · Play '+S.mg+'/'+S.G.length+'</p>'+(ok?'<p style="text-align:center;font:800 1.4rem \'Baloo 2\',sans-serif;margin:14px 0 0">+'+D.xp+' XP earned</p>':'<p class="muted" style="text-align:center;margin:14px 0 0">You need '+D.pass+'% to pass. Review the faces and try again.</p>')+'</div><button class="btn alt" data-a="retry">'+(ok?"Play again":"Try again")+'</button>';
  }
  $("m").innerHTML=h;
  if(st===3)showCam();
}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b||b.disabled)return;var a=b.dataset.a,k=+b.dataset.k;
  if(a==="next")go(1);
  else if(a==="nxt"){S.i<1?go(1,1):go(2)}
  else if(a==="prev"){go(1,0)}
  else if(a==="rc"){var q=S.Q[S.i],ok=k===ans(q.k);if(ok)S.rc++;b.classList.add(ok?"ok":"no");fb(ok?"Correct!":"It was “"+MARKS[ans(q.k)]+"”",ok?"var(--green)":"var(--coral)");document.querySelectorAll(".opt").forEach(function(x){x.disabled=true});
    after(function(){S.i<S.Q.length-1?go(2,S.i+1):go(3)},1100)}
  else if(a==="cam")camOn();
  else if(a==="done"){var n=document.querySelectorAll("#chk input:checked").length;
    if(n>=2){S.pc++;fb("Great face!","var(--green)");after(function(){S.i<S.P.length-1?go(3,S.i+1):go(4)},900)}
    else fb("Try again. Hint: "+D.cues[S.P[S.i].k].m,"var(--coral)")}
  else if(a==="pskip"){S.i<S.P.length-1?go(3,S.i+1):go(4)}
  else if(a==="pg"){var g=S.G[S.i],ok2=g.o[k]===g.s;if(ok2)S.mg++;b.classList.add(ok2?"ok":"no");fb(ok2?"Correct!":"It was “"+g.s.s+"”",ok2?"var(--green)":"var(--coral)");document.querySelectorAll(".opt").forEach(function(x){x.disabled=true});
    after(function(){S.i<S.G.length-1?go(4,S.i+1):go(5)},1100)}
  else if(a==="retry"){reset();go(0)}
});
reset();draw();
</script>
</body>
</html>

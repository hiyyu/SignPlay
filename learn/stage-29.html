<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SignPlay! – Stage 29</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8e8;--ink:#1f1b4d;--muted:#6c6794;--card:#fff;--lock:#e4e0f5;--sun:#ffc83d;--coral:#ff6b57;--teal:#1fb5a8;--green:#2fcf7f;--line:#1f1b4d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15123a;--ink:#fff6dc;--muted:#a49ed6;--card:#201b57;--lock:#2f2a74;--line:#0b0922}}
:root[data-theme="dark"]{--bg:#15123a;--ink:#fff6dc;--muted:#a49ed6;--card:#201b57;--lock:#2f2a74;--line:#0b0922}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.05rem/1.55 Nunito,system-ui,sans-serif}
h1,h2,h3{font-family:"Baloo 2",system-ui,sans-serif;line-height:1.1;margin:0}
button,a.btn{font:800 1.1rem "Baloo 2",sans-serif;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #3aa0ff;outline-offset:3px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:#2a2272;color:#fff6dc;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:4px solid #0f0c2e}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#2a2272;z-index:20}
.dots{flex:1;display:flex;gap:5px}.dots i{flex:1;height:10px;border-radius:9px;background:#0f0c2e;border:2px solid #fff6dc;transition:background .3s}
.dots i.on{background:var(--sun)}.dots i.now{background:#fff6dc}
.chip{font:800 .95rem "Baloo 2",sans-serif;background:#fff6dc;color:#1f1b4d;border-radius:99px;padding:0 12px}
main{max-width:560px;margin:0 auto;padding:22px 16px 60px}
.tag{font:800 .9rem "Baloo 2",sans-serif;background:var(--sun);color:#1f1b4d;border-radius:99px;padding:0 12px;display:inline-block}
h1{font-size:clamp(2rem,7vw,2.6rem);margin:10px 0 8px}h2{font-size:1.7rem;margin:6px 0 10px}
.card{background:var(--card);border:4px solid var(--line);border-radius:24px;box-shadow:0 6px 0 var(--line);padding:20px;margin:16px 0}
.muted{color:var(--muted)}
.btn{display:block;width:100%;background:var(--sun);color:#1f1b4d;border:3px solid #0f0c2e;border-radius:999px;padding:10px 20px;box-shadow:0 5px 0 #0f0c2e;text-align:center;text-decoration:none;margin-top:16px}
.btn.alt{background:var(--card);color:var(--ink);border-color:var(--line);box-shadow:0 5px 0 var(--line)}
.btn:disabled{background:var(--lock);color:var(--muted);box-shadow:none;cursor:not-allowed}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #0f0c2e}
.row{display:flex;gap:10px}.row .btn{margin-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}.chips span{font:700 .95rem Nunito,sans-serif;background:var(--lock);border-radius:99px;padding:2px 12px}
.demo{aspect-ratio:16/10;background:linear-gradient(135deg,#6b4ce6,#2a2272);border-radius:18px;border:3px solid var(--line);display:grid;place-items:center;color:#fff6dc;text-align:center;padding:12px;overflow:hidden;margin-top:12px}
.demo video{width:100%;height:100%;object-fit:cover}
.demo b{display:block;font:800 2.6rem "Baloo 2",sans-serif;line-height:1}
.demo small{opacity:.8}
.note{border-left:5px solid var(--coral);padding:4px 0 4px 12px;margin:12px 0 0;color:var(--muted)}
.key{background:var(--lock);border-radius:14px;padding:10px 14px;margin-top:14px;font-weight:700}
.opts{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}
.opt{background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 4px 0 var(--line);font-size:1.05rem;text-align:left}
.opt.ok{background:var(--green);color:#1f1b4d}.opt.no{background:var(--coral);color:#1f1b4d}
.fb{min-height:1.6em;font:800 1.1rem "Baloo 2",sans-serif;margin-top:12px}
.exp{font-weight:400;font-family:Nunito,sans-serif;color:var(--ink)}
.stars{font-size:3rem;text-align:center;letter-spacing:6px}
.big{font:800 3.4rem "Baloo 2",sans-serif;text-align:center;color:var(--teal);line-height:1}
.dd{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.dd div{border:3px solid var(--line);border-radius:14px;padding:10px;font-size:.95rem}
.dd .do{background:var(--green);color:#1f1b4d}.dd .dont{background:var(--coral);color:#1f1b4d}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="dots" id="dots" aria-hidden="true"></div>
  <span class="chip" id="xp"></span>
</header>
<main id="m"></main>

<script>
/* ===== STAGE 29 DATA: Deaf Culture & Etiquette =====
   Mostly reading and quizzes. No camera.
   cards: {h (title), b (text), k (key takeaway), v (optional video)}
   quiz:  knowledge check  {q, o, a, e (explanation)}
   scen:  "What would you do?" etiquette scenarios  {q, o, a, e}
   NOTE: the wording below is a draft. Have members of the Deaf community review the content, and adjust it for your country (the history here is US-based). */
var D={id:29,level:3,title:"Deaf Culture & Etiquette",goal:"Learn about Deaf history and community norms, and how to be respectful.",xp:100,pass:70,
cards:[
 {h:"Deaf and deaf",b:"Lowercase “deaf” often describes hearing loss. Capital “Deaf” is used for people who are part of the Deaf community and share its language and culture.",k:"Deaf is a culture and a language community, not just a medical condition."},
 {h:"Eye contact is listening",b:"In sign language conversation, eye contact shows you are paying attention. Looking away while someone is signing can feel like walking away from a spoken conversation.",k:"Keep your eyes on the signer."},
 {h:"Getting attention",b:"Common polite ways to get a Deaf person’s attention include a wave in their line of sight, a light tap on the shoulder or arm, or flicking the lights. Don’t grab or pull.",k:"Use a visible wave or a gentle tap."},
 {h:"Using an interpreter",b:"When an interpreter is present, speak or sign directly to the Deaf person, not to the interpreter. The interpreter relays both sides.",k:"Talk to the person, not the interpreter."},
 {h:"A short history",b:"In 1864 Gallaudet University was founded in the US, the first university for Deaf students. In 1880 an international conference in Milan promoted teaching by speech and discouraged sign language in schools. In 1988 the “Deaf President Now” protest led to Gallaudet’s first Deaf president.",k:"Deaf people have long fought for their language and rights."}],
quiz:[
 {q:"What does capital-D “Deaf” usually refer to?",o:["A cultural and linguistic community","Only a medical condition","A type of hearing aid","A sign for hello"],a:0,e:"Capital-D Deaf refers to the Deaf community, its language and its culture."},
 {q:"Why is eye contact important when signing?",o:["It shows you are paying attention","It is a game","It replaces signs","It is only for children"],a:0,e:"Eye contact is how you show you are listening."},
 {q:"An interpreter is present. Who do you speak to?",o:["The Deaf person","The interpreter only","Nobody","The nearest hearing person"],a:0,e:"Always address the Deaf person directly."},
 {q:"Gallaudet University was founded in which year?",o:["1864","1788","1925","1988"],a:0,e:"Gallaudet was founded in 1864."}],
scen:[
 {q:"A Deaf person is facing away from you. How do you get their attention?",o:["Gently tap their shoulder or wave in their sight","Throw something at them","Shout their name","Pull their arm hard"],a:0,e:"A gentle tap or a visible wave is polite."},
 {q:"You are signing with someone and your phone buzzes. What do you do?",o:["Finish the conversation, then check it","Look away and start texting","Walk off mid-sentence","Turn your back"],a:0,e:"Looking away breaks the conversation."},
 {q:"You don’t understand what they signed.",o:["Politely ask them to repeat or sign more slowly","Nod and pretend","Say “never mind” and leave","Laugh"],a:0,e:"Asking is respectful. Pretending isn’t."}]};

var STEPS=["Intro","Learn","Quiz","Scenarios","Results"];
var $=function(i){return document.getElementById(i)};
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function mix(L){return shuf(L).map(function(x){var c=x.o[x.a],o=shuf(x.o);return{x:x,o:o,a:o.indexOf(c)}})}
var S;
function reset(){S={st:0,i:0,qc:0,sc:0,Q:mix(D.quiz),C:mix(D.scen)}}
function go(n,i){S.st=n;S.i=i||0;draw();window.scrollTo(0,0)}
function total(){return Math.round((S.qc+S.sc)/(S.Q.length+S.C.length)*100)}
function fb(t,c){var f=$("fb");if(f){f.innerHTML=t;f.style.color=c||"var(--ink)"}}
function after(fn,ms){setTimeout(fn,ms||900)}
function qcard(q,tag,act){return '<span class="tag">'+tag+'</span><h2 style="margin-top:12px">'+q.x.q+'</h2><div class="opts">'+q.o.map(function(o,k){return '<button class="opt" data-a="'+act+'" data-k="'+k+'">'+o+'</button>'}).join("")+'</div><div class="fb" id="fb"></div>'}
function draw(){
  $("xp").textContent="+"+D.xp+" XP";
  $("dots").innerHTML=STEPS.map(function(_,k){return '<i class="'+(k<S.st?"on":k===S.st?"now":"")+'"></i>'}).join("");
  var h="",st=S.st;
  if(st===0){
    h='<span class="tag">Level '+D.level+' · Stage '+D.id+'</span><h1>'+D.title+'</h1><p class="muted">'+D.goal+'</p><div class="card"><h2>In this stage</h2><div class="chips">'+D.cards.map(function(x){return '<span>'+x.h+'</span>'}).join("")+'</div><p class="muted" style="margin:14px 0 0">Read short cards, then answer a quiz and some “What would you do?” scenarios. No camera needed.</p><p class="muted" style="margin:10px 0 0">About 8 minutes · Reward: '+D.xp+' XP · Pass mark: '+D.pass+'%</p></div><button class="btn" data-a="next">Start stage</button>';
  }else if(st===1){
    var c=D.cards[S.i];
    h='<span class="tag">Learn '+(S.i+1)+'/'+D.cards.length+'</span><div class="card"><h2>'+c.h+'</h2>'+(c.v?'<div class="demo"><video src="'+c.v+'" autoplay loop muted playsinline controls></video></div>':'')+'<p style="margin:10px 0 0">'+c.b+'</p><div class="key">Remember: '+c.k+'</div></div><div class="row"><button class="btn alt" data-a="prev"'+(S.i?'':' disabled')+'>Back</button><button class="btn" data-a="nxt">'+(S.i<D.cards.length-1?"Next":"Start the quiz")+'</button></div>';
  }else if(st===2){
    h=qcard(S.Q[S.i],"Quiz "+(S.i+1)+"/"+S.Q.length,"qz");
  }else if(st===3){
    h=qcard(S.C[S.i],"What would you do? "+(S.i+1)+"/"+S.C.length,"sc");
  }else{
    var p=total(),ok=p>=D.pass,stars=p>=90?3:p>=80?2:p>=D.pass?1:0;
    h='<span class="tag">'+(ok?"Stage complete!":"Almost there")+'</span><h1>'+D.title+'</h1><div class="card"><div class="stars" aria-label="'+stars+' of 3 stars">'+"★".repeat(stars)+'<span style="opacity:.25">'+"★".repeat(3-stars)+'</span></div><div class="big">'+p+'%</div><p class="muted" style="text-align:center;margin:6px 0 0">Quiz '+S.qc+'/'+S.Q.length+' · Scenarios '+S.sc+'/'+S.C.length+'</p>'+(ok?'<p style="text-align:center;font:800 1.4rem \'Baloo 2\',sans-serif;margin:14px 0 0">+'+D.xp+' XP earned</p>':'<p class="muted" style="text-align:center;margin:14px 0 0">You need '+D.pass+'% to pass. Re-read the cards and try again.</p>')+'</div><button class="btn alt" data-a="retry">'+(ok?"Play again":"Try again")+'</button>';
  }
  $("m").innerHTML=h;
}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b||b.disabled)return;var a=b.dataset.a,k=+b.dataset.k;
  if(a==="next")go(1);
  else if(a==="nxt"){S.i<D.cards.length-1?go(1,S.i+1):go(2)}
  else if(a==="prev"){go(1,S.i-1)}
  else if(a==="qz"||a==="sc"){var L=a==="qz"?S.Q:S.C,q=L[S.i],ok=k===q.a;
    if(ok){a==="qz"?S.qc++:S.sc++}
    b.classList.add(ok?"ok":"no");
    document.querySelectorAll(".opt").forEach(function(x){x.disabled=true});
    fb((ok?"Correct! ":"Not quite. ")+'<span class="exp">'+q.x.e+'</span>',ok?"var(--green)":"var(--coral)");
    after(function(){if(S.i<L.length-1)go(a==="qz"?2:3,S.i+1);else go(a==="qz"?3:4)},2000)}
  else if(a==="retry"){reset();go(0)}
});
reset();draw();
</script>
</body>
</html>

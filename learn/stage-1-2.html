<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SignPlay! – Stages 1–2</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8e8;--ink:#1f1b4d;--muted:#6c6794;--card:#fff;--lock:#e4e0f5;--sun:#ffc83d;--coral:#ff6b57;--teal:#1fb5a8;--green:#2fcf7f;--line:#1f1b4d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15123a;--ink:#fff6dc;--muted:#a49ed6;--card:#201b57;--lock:#2f2a74;--line:#0b0922}}
:root[data-theme="dark"]{--bg:#15123a;--ink:#fff6dc;--muted:#a49ed6;--card:#201b57;--lock:#2f2a74;--line:#0b0922}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.05rem/1.55 Nunito,system-ui,sans-serif}
h1,h2{font-family:"Baloo 2",system-ui,sans-serif;line-height:1.1;margin:0}
button{font:800 1.1rem "Baloo 2",sans-serif;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid #3aa0ff;outline-offset:3px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:#2a2272;color:#fff6dc;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 16px;border-bottom:4px solid #0f0c2e}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#2a2272;z-index:20}
#xp{margin-right:auto}
.sw{display:flex;border:2px solid #fff6dc;border-radius:99px;overflow:hidden;margin-right:auto}
.sw button{background:none;border:0;color:#fff6dc;font-size:.95rem;padding:0 14px}.sw button[aria-pressed=true]{background:var(--sun);color:#1f1b4d}
.chip{font:800 .95rem "Baloo 2",sans-serif;background:#fff6dc;color:#1f1b4d;border-radius:99px;padding:0 12px}
.dots{flex-basis:100%;display:flex;gap:5px}.dots i{flex:1;height:10px;border-radius:9px;background:#0f0c2e;border:2px solid #fff6dc}
.dots i.on{background:var(--sun)}.dots i.now{background:#fff6dc}
main{max-width:560px;margin:0 auto;padding:22px 16px 60px}
.tag{font:800 .9rem "Baloo 2",sans-serif;background:var(--sun);color:#1f1b4d;border-radius:99px;padding:0 12px;display:inline-block}
h1{font-size:clamp(2rem,7vw,2.6rem);margin:10px 0 8px}h2{font-size:1.6rem;margin:6px 0 10px}
.card{background:var(--card);border:4px solid var(--line);border-radius:24px;box-shadow:0 6px 0 var(--line);padding:18px;margin:16px 0}
.muted{color:var(--muted)}
.btn{display:block;width:100%;background:var(--sun);color:#1f1b4d;border:3px solid #0f0c2e;border-radius:999px;padding:10px 20px;box-shadow:0 5px 0 #0f0c2e;text-align:center;margin-top:16px}
.btn.alt{background:var(--card);color:var(--ink);border-color:var(--line);box-shadow:0 5px 0 var(--line)}
.btn:disabled{background:var(--lock);color:var(--muted);box-shadow:none;cursor:not-allowed}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #0f0c2e}
.row{display:flex;gap:10px}.row .btn{margin-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}.chips span{font:700 .95rem Nunito,sans-serif;background:var(--lock);border-radius:99px;padding:2px 12px}
.demo{aspect-ratio:16/10;background:linear-gradient(135deg,#6b4ce6,#2a2272);border-radius:18px;border:3px solid var(--line);display:grid;place-items:center;color:#fff6dc;text-align:center;padding:12px;overflow:hidden}
.demo video{width:100%;height:100%;object-fit:cover}.demo b{display:block;font:800 2.4rem "Baloo 2",sans-serif;line-height:1}.demo small{opacity:.8}
.word{font:800 2.2rem "Baloo 2",sans-serif;margin:10px 0 2px}
.note{border-left:5px solid var(--coral);padding:4px 0 4px 12px;margin:10px 0 0;color:var(--muted)}
.mo{display:inline-block;font:800 .85rem "Baloo 2",sans-serif;background:var(--coral);color:#1f1b4d;border-radius:99px;padding:0 10px;margin-left:8px;vertical-align:middle}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:10px;margin-top:14px}
.tile{position:relative;aspect-ratio:1;background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--line);font-size:1.5rem;padding:0}
.tile.seen{background:var(--green);color:#1f1b4d}.tile.cur{outline:4px solid var(--sun);outline-offset:2px}
.tile i{position:absolute;top:1px;right:6px;font-size:.9rem;font-style:normal}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 4px 0 var(--line);font-size:1.2rem}
.opt.ok{background:var(--green);color:#1f1b4d}.opt.no{background:var(--coral);color:#1f1b4d}
.fb{min-height:1.6em;font:800 1.1rem "Baloo 2",sans-serif;margin-top:12px}
.cam{position:relative;aspect-ratio:4/3;background:#0f0c2e;border-radius:18px;border:3px solid var(--line);display:grid;place-items:center;color:#c9c4f2;text-align:center;padding:12px;overflow:hidden}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.corner{position:absolute;width:30px;height:30px;border:5px solid var(--sun)}
.c1{top:10px;left:10px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}.c2{top:10px;right:10px;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.c3{bottom:10px;left:10px;border-right:0;border-top:0;border-radius:0 0 0 10px}.c4{bottom:10px;right:10px;border-left:0;border-top:0;border-radius:0 0 10px 0}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs button{background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:14px;padding:10px;font:700 .92rem/1.25 Nunito,sans-serif;box-shadow:0 4px 0 var(--line);min-height:64px}
.pairs .r button{font:800 1.3rem "Baloo 2",sans-serif}
.pairs button.sel{background:var(--sun);color:#1f1b4d}.pairs button.gone{visibility:hidden}.pairs button.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.stars{font-size:3rem;text-align:center;letter-spacing:6px}.big{font:800 3.4rem "Baloo 2",sans-serif;text-align:center;color:var(--teal);line-height:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <span class="chip" id="xp">+50 XP</span>
  <div class="dots" id="dots" aria-hidden="true"></div>
</header>
<main id="m"></main>
<script src="progress.js"></script>

<script>
/* ===== STAGE DATA (type "sets"): a stage is a list of sets; each set is a short round ===== */
/* s = {w:label, t:how to sign it, m:common mistake (optional), motion:true if movement matters}; add v:"videos/a.mp4" for a demo video */
var Ds=[
{id:1,level:1,title:"The Manual Alphabet (A–Z)",goal:"Master the handshapes of the manual alphabet for clear fingerspelling.",xp:50,pass:50,sets:[
 {name:"A–I",signs:[
  {w:"A",t:"Fist with the thumb resting against the side of your index finger."},
  {w:"B",t:"Flat hand, fingers straight up and together, thumb folded across the palm."},
  {w:"C",t:"Curve your hand into the shape of the letter C."},
  {w:"D",t:"Index finger points up while the other fingers touch the thumb."},
  {w:"E",t:"Fingertips curl down onto the thumb, which is tucked underneath."},
  {w:"F",t:"Thumb and index finger touch to make a circle, other three fingers up."},
  {w:"G",t:"Index finger and thumb point sideways, parallel to each other."},
  {w:"H",t:"Index and middle fingers point sideways together."},
  {w:"I",t:"Fist with the little finger pointing up."}]},
 {name:"J–R",signs:[
  {w:"J",motion:true,t:"Start with the I shape, then draw a J in the air with your little finger."},
  {w:"K",t:"Index finger up, middle finger out, thumb resting between them."},
  {w:"L",t:"Thumb and index finger make an L shape."},
  {w:"M",t:"Thumb tucked under three fingers."},
  {w:"N",t:"Thumb tucked under two fingers."},
  {w:"O",t:"All fingertips touch the thumb to make an O."},
  {w:"P",t:"Like K, but pointing downward."},
  {w:"Q",t:"Like G, but pointing downward."},
  {w:"R",t:"Index and middle fingers crossed."}]},
 {name:"S–Z",signs:[
  {w:"S",t:"Fist with the thumb wrapped across the front of your fingers."},
  {w:"T",t:"Fist with the thumb tucked between index and middle fingers."},
  {w:"U",t:"Index and middle fingers up, held together."},
  {w:"V",t:"Index and middle fingers up, spread apart in a V."},
  {w:"W",t:"Index, middle and ring fingers up and spread."},
  {w:"X",t:"Index finger bent into a hook."},
  {w:"Y",t:"Thumb and little finger out, the others folded in."},
  {w:"Z",motion:true,t:"Point with your index finger and draw a Z in the air."}]}]},
{id:2,level:1,title:"Numbers & Counting (1–100)",goal:"Sign digits, the teens and the tens so you can count and share quantities.",xp:50,pass:50,sets:[
 {name:"1–10",signs:[
  {w:"1",t:"Index finger points up."},
  {w:"2",t:"Index and middle fingers up."},
  {w:"3",t:"Thumb, index and middle fingers extended."},
  {w:"4",t:"Four fingers up, thumb tucked into the palm."},
  {w:"5",t:"Open hand, all five fingers spread."},
  {w:"6",t:"Thumb touches the little finger, other three fingers up."},
  {w:"7",t:"Thumb touches the ring finger, others up."},
  {w:"8",t:"Thumb touches the middle finger, others up."},
  {w:"9",t:"Thumb touches the index finger, others up."},
  {w:"10",motion:true,t:"Thumbs-up fist, give it a small shake."}]},
 {name:"11–20",signs:[
  {w:"11",motion:true,t:"Fist, flick the index finger up (twice)."},
  {w:"12",motion:true,t:"Fist, flick the index and middle fingers up (twice)."},
  {w:"13",motion:true,t:"Make the 3 shape and bend the fingers twice."},
  {w:"14",motion:true,t:"Make the 4 shape and bend the fingers twice."},
  {w:"15",motion:true,t:"Make the 5 shape and bend the fingers twice."},
  {w:"16",motion:true,t:"Make the 6 shape and twist your wrist."},
  {w:"17",motion:true,t:"Make the 7 shape and twist your wrist."},
  {w:"18",motion:true,t:"Make the 8 shape and twist your wrist."},
  {w:"19",motion:true,t:"Make the 9 shape and twist your wrist."},
  {w:"20",motion:true,t:"Sign 2, then close to the 0 shape."}]},
 {name:"Tens",signs:[
  {w:"30",motion:true,t:"Sign 3, then close to the 0 shape."},
  {w:"40",motion:true,t:"Sign 4, then close to the 0 shape."},
  {w:"50",motion:true,t:"Sign 5, then close to the 0 shape."},
  {w:"60",motion:true,t:"Sign 6, then close to the 0 shape."},
  {w:"70",motion:true,t:"Sign 7, then close to the 0 shape."},
  {w:"80",motion:true,t:"Sign 8, then close to the 0 shape."},
  {w:"90",motion:true,t:"Sign 9, then close to the 0 shape."},
  {w:"100",motion:true,t:"Sign 1, then the C shape."}]}]}];

var D=Ds[0],S,stream=null,pool;
(function(){var n=parseInt(new URLSearchParams(location.search).get("stage"),10);if(n>=1&&n<=Ds.length)D=Ds[n-1]})();
var $=function(i){return document.getElementById(i)};
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function reset(){
  pool=[].concat.apply([],D.sets.map(function(x){return x.signs}));
  var G=shuf(pool).slice(0,4);
  S={st:0,ph:0,i:0,k:-1,seen:{},rc:0,pc:0,mg:0,att:0,gone:{},tried:{},sel:null,Q:[],P:[],G:G,left:shuf(G),right:shuf(G)};
  $("xp").textContent="+"+D.xp+" XP";
}
function prep(si){
  if(S.Q[si])return;var sg=D.sets[si].signs;
  S.Q[si]=shuf(sg).slice(0,4).map(function(s){return{s:s,o:shuf([s].concat(shuf(pool.filter(function(x){return x!==s})).slice(0,3)))}});
  S.P[si]=shuf(sg).sort(function(a,b){return (b.motion?1:0)-(a.motion?1:0)}).slice(0,3);
}
function stop(){if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}}
function go(st,ph,i){stop();S.st=st;S.ph=ph||0;S.i=i||0;S.k=-1;S.att=0;if(!S.ph)S.seen={};if(st>=1&&st<=D.sets.length)prep(st-1);draw();window.scrollTo(0,0)}
function demo(s){return '<div class="demo">'+(s.v?'<video src="'+s.v+'" autoplay loop muted playsinline></video>':'<div><b>▶</b><small>Demo video coming soon</small><small> · “'+s.w+'”</small></div>')+'</div>'}
function total(){var n=0;S.Q.forEach(function(q){n+=q.length});S.P.forEach(function(p){n+=p.length});n+=S.G.length;return Math.round((S.rc+S.pc+S.mg)/n*100)}
function mo(s){return s.motion?'<span class="mo">↻ motion</span>':""}
function fb(t,c){var f=$("fb");if(f){f.textContent=t;f.style.color=c||"var(--ink)"}}
function camBlock(){return '<div class="cam" id="cam"><i class="corner c1"></i><i class="corner c2"></i><i class="corner c3"></i><i class="corner c4"></i><span id="cmsg">Camera is off</span></div>'}
function draw(){
  var n=D.sets.length,st=S.st,h="",si=st-1,set=D.sets[si];
  $("dots").innerHTML=Array(n+3).fill(0).map(function(_,k){return '<i class="'+(k<st?"on":k===st?"now":"")+'"></i>'}).join("");
  document.querySelectorAll(".sw button").forEach(function(b){b.setAttribute("aria-pressed",String(+b.dataset.k===Ds.indexOf(D)))});
  if(st===0){
    h='<span class="tag">Level '+D.level+' · Stage '+D.id+'</span><h1>'+D.title+'</h1><p class="muted">'+D.goal+'</p><div class="card"><h2>'+n+' short sets</h2>'+D.sets.map(function(x,k){return '<p style="margin:6px 0"><b>Set '+(k+1)+': '+x.name+'</b> <span class="muted">· '+x.signs.length+' signs</span></p>'}).join("")+'<p class="muted" style="margin:12px 0 0">Each set: learn → recognise → practise. Then a final game. Pass mark: '+D.pass+'% · Reward: '+D.xp+' XP</p></div><button class="btn" data-a="next">Start Set 1</button>';
  }else if(st<=n){
    var ph=S.ph;
    if(ph===0){
      var cur=S.k>=0?set.signs[S.k]:null,cnt=Object.keys(S.seen).length;
      h='<span class="tag">Set '+st+'/'+n+' · '+set.name+' · Learn</span><h2>Tap each sign</h2>'+
      (cur?demo(cur)+'<div class="word">'+cur.w+mo(cur)+'</div><p style="margin:0">'+cur.t+'</p>'+(cur.m?'<p class="note"><b>Common mistake:</b> '+cur.m+'</p>':""):'<div class="demo"><div><b>👆</b><small>Pick a tile to see how to sign it</small></div></div>')+
      '<div class="tiles">'+set.signs.map(function(x,k){return '<button class="tile'+(S.seen[k]?" seen":"")+(S.k===k?" cur":"")+'" data-a="tile" data-k="'+k+'" aria-label="'+x.w+'">'+x.w+(x.motion?'<i>↻</i>':"")+'</button>'}).join("")+'</div><p class="muted" style="margin:12px 0 0">'+cnt+'/'+set.signs.length+' seen</p><button class="btn" data-a="lcont"'+(cnt<set.signs.length?" disabled":"")+'>Continue to quiz</button>';
    }else if(ph===1){
      var q=S.Q[si][S.i];
      h='<span class="tag">Set '+st+' · Recognise '+(S.i+1)+'/'+S.Q[si].length+'</span><h2>Which sign is this?</h2>'+demo(q.s)+'<p class="muted" style="margin:10px 0 0">Hint: '+q.s.t+'</p><div class="opts">'+q.o.map(function(o,k){return '<button class="opt" data-a="rc" data-k="'+k+'">'+o.w+'</button>'}).join("")+'</div><div class="fb" id="fb"></div>';
    }else{
      var s=S.P[si][S.i];
      h='<span class="tag">Set '+st+' · Practise '+(S.i+1)+'/'+S.P[si].length+'</span><h2>Sign: “'+s.w+'”'+mo(s)+'</h2><p class="muted" style="margin:0 0 10px">'+s.t+(s.motion?" Move through the whole shape, not just the start.":"")+'</p>'+camBlock()+'<div class="fb" id="fb"></div><div class="row"><button class="btn alt" data-a="cam">Turn on camera</button><button class="btn" data-a="chk">Check my sign</button></div><button class="btn alt" data-a="pskip">Skip this sign</button><p class="muted" style="font-size:.85rem;margin:12px 0 0">Prototype: the check is simulated (fails once, then passes). Letters use a still-image model; motion signs use a short video sequence.</p>';
    }
  }else if(st===n+1){
    h='<span class="tag">Final game</span><h2>Match the sign to its label</h2><p class="muted" style="margin:0 0 12px">Tap a description, then tap its label.</p><div class="pairs"><div style="display:grid;gap:10px">'+S.left.map(function(x){return '<button data-a="pl" data-w="'+x.w+'" class="'+(S.gone[x.w]?"gone ":"")+(S.sel===x.w?"sel":"")+'">'+x.t+'</button>'}).join("")+'</div><div class="r" style="display:grid;gap:10px">'+S.right.map(function(x){return '<button data-a="pr" data-w="'+x.w+'" class="'+(S.gone[x.w]?"gone":"")+'">'+x.w+'</button>'}).join("")+'</div></div><div class="fb" id="fb"></div>';
  }else{
    var p=total(),ok=p>=D.pass,stars=p>=90?3:p>=80?2:p>=D.pass?1:0;if(window.SPProgress){setTimeout(function(){SPProgress.addBack(ok)},0);if(ok)SPProgress.complete(D.id,p,stars)}
    h='<span class="tag">'+(ok?"Stage complete!":"Almost there")+'</span><h1>'+D.title+'</h1><div class="card"><div class="stars" aria-label="'+stars+' of 3 stars">'+"★".repeat(stars)+'<span style="opacity:.25">'+"★".repeat(3-stars)+'</span></div><div class="big">'+p+'%</div>'+(ok?'<p style="text-align:center;font:800 1.4rem \'Baloo 2\',sans-serif;margin:14px 0 0">+'+D.xp+' XP earned</p>':'<p class="muted" style="text-align:center;margin:14px 0 0">You need '+D.pass+'% to pass. Review the sets and try again.</p>')+'</div><div class="chips">'+D.sets.map(function(x){return '<span>✓ '+x.name+'</span>'}).join("")+'</div><button class="btn alt" data-a="retry">'+(ok?"Play again":"Try again")+'</button>';
  }
  $("m").innerHTML=h;
}
function after(fn,ms){setTimeout(fn,ms||900)}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b||b.disabled)return;var a=b.dataset.a,k=+b.dataset.k,n=D.sets.length,si=S.st-1;
  if(a==="next")go(1);
  else if(a==="tile"){S.k=k;S.seen[k]=1;draw()}
  else if(a==="lcont")go(S.st,1);
  else if(a==="rc"){var q=S.Q[si][S.i],ok=q.o[k]===q.s;if(ok)S.rc++;b.classList.add(ok?"ok":"no");fb(ok?"Correct!":"It was “"+q.s.w+"”",ok?"var(--green)":"var(--coral)");document.querySelectorAll(".opt").forEach(function(x){x.disabled=true});
    after(function(){S.i<S.Q[si].length-1?go(S.st,1,S.i+1):go(S.st,2)},1100)}
  else if(a==="cam"){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$("cmsg").textContent="Camera not available here";return}
    navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}}).then(function(s){stream=s;var v=document.createElement("video");v.autoplay=true;v.muted=true;v.playsInline=true;v.srcObject=s;$("cam").insertBefore(v,$("cam").firstChild);$("cmsg").textContent="";b.textContent="Camera on";b.disabled=true}).catch(function(){$("cmsg").textContent="Camera blocked. Allow access, or use the simulated check."})}
  else if(a==="chk"){S.att++;
    if(S.att<2){fb("Almost! Check the handshape again: "+S.P[si][S.i].t,"var(--coral)")}
    else{S.pc++;S.att=0;fb("Great sign!","var(--green)");after(nextP,900)}}
  else if(a==="pskip"){S.att=0;nextP()}
  else if(a==="pl"){S.sel=b.dataset.w;draw()}
  else if(a==="pr"){if(!S.sel){fb("Pick a description first");return}
    if(S.sel===b.dataset.w){S.gone[S.sel]=1;if(!S.tried[S.sel])S.mg++;S.sel=null;draw();fb("Match!","var(--green)");
      if(Object.keys(S.gone).length===S.G.length)after(function(){go(n+2)},900)}
    else{b.classList.add("bad");S.tried[S.sel]=1;S.sel=null;fb("Not a match. Try again","var(--coral)");setTimeout(draw,450)}}
  else if(a==="retry"){reset();go(0)}
});
function nextP(){var si=S.st-1,n=D.sets.length;
  if(S.i<S.P[si].length-1)go(S.st,2,S.i+1);else go(S.st+1)}
reset();draw();
</script>
</body>
</html>
